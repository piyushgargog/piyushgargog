<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816">
        <animate attributeName="stop-color" values="#050816;#0A1030;#050816" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="0.55" stop-color="#101D40"/>
      <stop offset="1" stop-color="#1E3A8A">
        <animate attributeName="stop-color" values="#1E3A8A;#0F766E;#1E3A8A" dur="14s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#BFDBFE"/>
      <stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <radialGradient id="orb1"><stop offset="0" stop-color="#2563EB" stop-opacity="0.55"/><stop offset="1" stop-color="#2563EB" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb2"><stop offset="0" stop-color="#0F766E" stop-opacity="0.5"/><stop offset="1" stop-color="#0F766E" stop-opacity="0"/></radialGradient>
    <radialGradient id="orb3"><stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <circle r="260" fill="url(#orb1)">
    <animate attributeName="cx" values="180;320;180" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;110;40" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle r="230" fill="url(#orb2)">
    <animate attributeName="cx" values="1130;990;1130" dur="19s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="320;230;320" dur="19s" repeatCount="indefinite"/>
  </circle>
  <circle r="170" fill="url(#orb3)">
    <animate attributeName="cx" values="950;860;950" dur="13s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;90;30" dur="13s" repeatCount="indefinite"/>
  </circle>

  <g fill="#FFFFFF">
    <circle cx="120" cy="70" r="2"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="340" cy="40" r="1.6"><animate attributeName="opacity" values="1;0.2;1" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="66" r="2.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="36" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1080" cy="60" r="2"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="4.6s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="130" r="1.6"><animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="120" r="1.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="250" r="1.8"><animate attributeName="opacity" values="1;0.3;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1210" cy="250" r="2.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="300" r="1.5"><animate attributeName="opacity" values="0.7;0.2;0.7" dur="3.6s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="'Consolas', 'Courier New', monospace" font-size="17" fill="#7DD3FC">
    <rect x="1010" y="34" width="218" height="38" rx="19" fill="#FFFFFF" opacity="0.07"/>
    <text x="1032" y="59">● DELHI, INDIA</text>
  </g>

  <text x="640" y="168" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="6" fill="url(#name)">PIYUSH GARG</text>

  <rect x="440" y="196" width="400" height="3" rx="1.5" fill="#2563EB" opacity="0.85"/>

  <text x="640" y="240" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="25" letter-spacing="3" fill="#CBD5E1">BUILDING AI SYSTEMS · DEVELOPER TOOLS · OPEN SOURCE</text>

  <text x="640" y="312" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="21" fill="#4ADE80">&gt; less hype. more building.<tspan fill="#4ADE80">_</tspan><animate attributeName="opacity" values="1;1;0;1" dur="1.1s" repeatCount="indefinite"/></text>
</svg>
